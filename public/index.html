<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Smartgkquiz.com — Generate GK PDF</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 40px; }
      .container { max-width: 720px; margin: 0 auto; }
      label { display: block; margin-top: 16px; }
      input, select { padding: 8px; width: 100%; box-sizing: border-box; }
      button { margin-top: 20px; padding: 10px 16px; font-size: 16px; }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Smartgkquiz.com — Generate General Knowledge PDF</h1>
      <p>Choose how many pages and items per page. For testing, use small numbers first (e.g., 10 or 100).</p>

      <label>Pages
        <input id="pages" type="number" value="100" min="1" />
      </label>

      <label>Items per page
        <input id="itemsPerPage" type="number" value="40" min="1" />
      </label>

      <label>Open inline instead of download
        <select id="inline">
          <option value="false">Download (attachment)</option>
          <option value="true">Open in browser (inline)</option>
        </select>
      </label>

      <button id="generate">Generate PDF</button>

      <p id="status"></p>
    </div>

    <script>
      document.getElementById('generate').addEventListener('click', () => {
        const pages = document.getElementById('pages').value;
        const itemsPerPage = document.getElementById('itemsPerPage').value;
        const inline = document.getElementById('inline').value;
        const status = document.getElementById('status');
        status.textContent = 'Requesting PDF... This may take some time for large values.';

        // Build URL
        const url = `/generate-pdf?pages=${encodeURIComponent(pages)}&itemsPerPage=${encodeURIComponent(itemsPerPage)}&inline=${encodeURIComponent(inline)}`;

        // For download, simply set window.location
        if (inline === 'false') {
          // Force download by creating an anchor
          const a = document.createElement('a');
          a.href = url;
          a.download = '';
          document.body.appendChild(a);
          a.click();
          a.remove();
          status.textContent = 'Download started. Check your browser downloads.';
        } else {
          // Open in new tab for inline
          window.open(url, '_blank');
          status.textContent = 'Opening PDF in a new tab...';
        }
      });
    </script>
  </body>
</html>
